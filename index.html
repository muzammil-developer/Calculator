<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <!-- Bootstrap 5 (for layout utilities) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calc-page d-flex align-items-center justify-content-center">
    <div class="calc-shell">

      <p class="calc-eyebrow">Quick Math</p>

      <div class="calc" role="application" aria-label="Calculator">

        <!-- Display -->
        <div class="calc__display">
          <div class="calc__expression" id="expression" aria-hidden="true">&nbsp;</div>
          <div class="calc__result" id="display" aria-live="polite" aria-atomic="true">0</div>
        </div>

        <!-- Keys -->
        <div class="calc__keys" id="keys">

          <!-- Row 1 -->
          <button type="button" class="key key--fn" data-action="clear"     data-key="AC" aria-label="All clear">AC</button>
          <button type="button" class="key key--fn" data-action="backspace" data-key="⌫"  aria-label="Backspace">⌫</button>
          <button type="button" class="key key--fn" data-action="percent"   data-key="%"  aria-label="Percent">%</button>
          <button type="button" class="key key--op" data-op="÷"             data-key="÷"  aria-label="Divide">÷</button>

          <!-- Row 2 -->
          <button type="button" class="key" data-digit="7" data-key="7">7</button>
          <button type="button" class="key" data-digit="8" data-key="8">8</button>
          <button type="button" class="key" data-digit="9" data-key="9">9</button>
          <button type="button" class="key key--op" data-op="×" data-key="×" aria-label="Multiply">×</button>

          <!-- Row 3 -->
          <button type="button" class="key" data-digit="4" data-key="4">4</button>
          <button type="button" class="key" data-digit="5" data-key="5">5</button>
          <button type="button" class="key" data-digit="6" data-key="6">6</button>
          <button type="button" class="key key--op" data-op="−" data-key="−" aria-label="Subtract">−</button>

          <!-- Row 4 -->
          <button type="button" class="key" data-digit="1" data-key="1">1</button>
          <button type="button" class="key" data-digit="2" data-key="2">2</button>
          <button type="button" class="key" data-digit="3" data-key="3">3</button>
          <button type="button" class="key key--op" data-op="+" data-key="+" aria-label="Add">+</button>

          <!-- Row 5 -->
          <button type="button" class="key key--fn"     data-action="sign"    data-key="±" aria-label="Toggle sign">±</button>
          <button type="button" class="key"             data-digit="0"        data-key="0">0</button>
          <button type="button" class="key"             data-action="decimal" data-key="." aria-label="Decimal point">.</button>
          <button type="button" class="key key--equals" data-action="equals"  data-key="=" aria-label="Equals">=</button>

        </div>
      </div>
    </div>
  </main>

  <!-- Custom script -->
  <script src="index.js"></script>
</body>
</html>
